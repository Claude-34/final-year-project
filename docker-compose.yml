services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pothole
      POSTGRES_PASSWORD: pothole
      POSTGRES_DB: pothole
    ports:
      - '5432:5432'
    volumes:
      - pothole_pg_data:/var/lib/postgresql/data

volumes:
  pothole_pg_data:
