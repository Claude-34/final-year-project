services:
  - type: web
    name: pothole-api
    runtime: node
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pothole-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false

databases:
  - name: pothole-db
    plan: free
    databaseName: pothole
    user: pothole
